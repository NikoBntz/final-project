services:
  - type: web
    name: levinor-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    preDeployCommand: npm run seed
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
